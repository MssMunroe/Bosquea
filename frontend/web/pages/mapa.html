<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../assets/img/logo.png">
    <title>Bosquea - Mapa</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- 1. CSS de Leaflet (Siempre en el Head) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <header class="main-header"></header>
    <div id="hero-container"></div>

    <main class="content-wrapper detail-page"> <!-- detail-page añade el padding para el header -->
        
        <section class="map-section">
            <div id="map-container-wrapper" style="position: relative;">
                
                <!-- 2. Contenedor donde se dibujará el mapa -->
                <div id="map" style="height: 650px; width: 100%; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); z-index: 1;"></div>
                
                <!-- 3. Tu Leyenda (Flotando sobre el mapa de Leaflet) -->
                <img src="../assets/img/leyenda-mapa.png" alt="Leyenda" class="map-legend">
                
            </div>
        </section>

    </main>

    <footer class="main-footer"></footer>

    <!-- 4. JS de Leaflet y tu Main.js (Antes de cerrar el body) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
