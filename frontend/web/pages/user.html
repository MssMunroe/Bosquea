<section class="profile-header">
    <div class="profile-banner" style="background-image: url('../assets/img/banner-perfil.jpg');">
        <h1 class="profile-username" id="user-nickname">@Cargando...</h1>
    </div>
    <div class="profile-avatar-container">
        <img src="../assets/uploads/default.png" alt="Usuario" class="profile-avatar">
    </div>
</section>

<div class="profile-dashboard">
    <aside class="profile-sidebar">
        <nav class="sidebar-menu">
            <a href="#" class="sidebar-link active" data-section="deseados">
                <i class="fas fa-bookmark main-icon"></i>
                <span>Deseados</span>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <a href="#" class="sidebar-link" data-section="visitados">
                <i class="fas fa-folder main-icon"></i>
                <span>Visitados</span>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <a href="#" class="sidebar-link" data-section="comentarios">
                <i class="fas fa-share-alt main-icon"></i>
                <span>Comentarios</span>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <a href="#" class="sidebar-link" data-section="configuracion">
                <i class="fas fa-cog main-icon"></i>
                <span>Configuración</span>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <a href="#" class="sidebar-link" data-section="formularios">
                <i class="fas fa-file-alt main-icon"></i>
                <span>Formularios</span>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <a href="#" id="btn-logout" class="sidebar-link logout-style">
                <i class="fas fa-sign-out-alt main-icon"></i>
                <span>Cerrar Sesión</span>
            </a>
        </nav>
    </aside>

    <main class="profile-content" id="profile-content">

        <section id="section-deseados" class="content-section active">
            <h2 class="section-display-title">Deseados</h2>
            <div class="mini-parques-grid" id="grid-deseados"></div>
        </section>

        <section id="section-visitados" class="content-section" style="display: none;">
            <h2 class="section-display-title">Visitados</h2>
            <div class="mini-parques-grid" id="grid-visitados"></div>
        </section>

        <section id="section-comentarios" class="content-section" style="display: none;">
            <h2 class="section-display-title">Comentarios</h2>
            <div class="comments-list" id="list-comentarios"></div>
        </section>

        <section id="section-configuracion" class="content-section" style="display: none;">
            <h2 class="section-display-title">Configuración</h2>

            <div class="config-options-list">
                <div class="config-item">
                    <div class="config-item-left">
                        <i class="fas fa-bell config-icon"></i>
                        <span class="config-label">Notificaciones</span>
                    </div>
                    <div class="config-item-right">
                        <label class="corporate-switch">
                            <input type="checkbox" checked disabled>
                            <span class="corporate-slider"></span>
                        </label>
                    </div>
                </div>

                <div class="config-item clickable-config">
                    <div class="config-item-left">
                        <i class="fas fa-fingerprint config-icon"></i>
                        <span class="config-label">Seguridad</span>
                    </div>
                    <div class="config-item-right">
                        <i class="fas fa-chevron-right config-arrow"></i>
                    </div>
                </div>

                <div class="config-item clickable-config">
                    <div class="config-item-left">
                        <i class="fas fa-user config-icon"></i>
                        <span class="config-label">Datos Perfil</span>
                    </div>
                    <div class="config-item-right">
                        <i class="fas fa-chevron-right config-arrow"></i>
                    </div>
                </div>

                <div class="config-item clickable-config">
                    <div class="config-item-left">
                        <i class="fas fa-bug config-icon"></i>
                        <span class="config-label">Reportes</span>
                    </div>
                    <div class="config-item-right">
                        <i class="fas fa-chevron-right config-arrow"></i>
                    </div>
                </div>

                <div class="config-item clickable-config">
                    <div class="config-item-left">
                        <i class="fas fa-lock config-icon"></i>
                        <span class="config-label">Bloqueados</span>
                    </div>
                    <div class="config-item-right">
                        <span class="badge-blocked">2</span>
                        <i class="fas fa-chevron-right config-arrow"></i>
                    </div>
                </div>
            </div>
        </section>

        <section id="section-formularios" class="content-section" style="display: none;">
            <h2 class="section-display-title">Formularios</h2>

            <form id="form-reporte-error" class="error-report-form">
                <div class="form-group-corporate">
                    <label for="reporte-email">Email <span class="required-asterisk">*</span></label>
                    <div class="input-with-icon-container">
                        <span class="field-icon-left">
                            <i class="fas fa-envelope"></i>
                        </span>
                        <input type="email" id="reporte-email" class="input-corporate-readonly" readonly>
                    </div>
                </div>

                <div class="form-group-corporate">
                    <label for="reporte-descripcion">Describe el error <span class="required-asterisk">*</span></label>
                    <span class="form-field-subtitle">Por favor, detalla el problema</span>
                    <textarea id="reporte-descripcion" class="textarea-corporate" rows="5" required></textarea>
                </div>

                <div class="form-group-corporate">
                    <label for="file-reporte-captura">Captura del problema</label>

                    <div class="drag-drop-zone" id="drop-zone-captura"
                        onclick="document.getElementById('file-reporte-captura').click()">

                        <input type="file" id="file-reporte-captura" accept="image/*" style="display: none;">
                        <i class="fas fa-folder drag-zone-icon"></i>
                        <p class="drag-zone-text">Arrastra el archivo o <span class="accent-link-text">buscar</span></p>
                    </div>
                </div>

                <button type="submit" class="btn-submit-report">Enviar Reporte</button>
            </form>
        </section>

    </main>

</div>
