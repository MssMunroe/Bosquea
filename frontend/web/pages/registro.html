<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/MssMunroe/Bosquea/refs/heads/main/frontend/web/assets/img/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosquea - Registro de Usuario</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <header class="main-header"></header>

    <main class="content-wrapper register-bg">
        <section class="register-card">
            <h1 class="register-title">Registro</h1>

            <form id="registerForm" class="grid-form">
                <!-- Columna Izquierda -->
                <div class="form-group">
                    <label>Nombre *</label>
                    <div class="input-container">
                        <i class="fas fa-user-circle input-icon"></i>
                        <input type="text" name="nombre" required>
                    </div>
                </div>

                <!-- Columna Derecha -->
                <div class="form-group">
                    <label>DNI *</label>
                    <div class="input-container">
                        <i class="fas fa-id-card input-icon"></i>
                        <input type="text" name="dni" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Nickname *</label>
                    <div class="input-container">
                        <i class="fas fa-at input-icon"></i>
                        <input type="text" name="nickname" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Teléfono</label>
                    <div class="input-container">
                        <i class="fas fa-phone-alt input-icon"></i>
                        <input type="tel" name="telefono">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email *</label>
                    <div class="input-container">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" name="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Contraseña *</label>
                    <div class="input-container">
                        <i class="fas fa-lock input-icon"></i> <!-- Icono de candado a la izquierda -->
                        <input type="password" name="password" required>
                        <i class="fas fa-eye-slash eye-icon"></i> <!-- Ojo a la derecha -->
                    </div>
                </div>

                <div class="form-group">
                    <label>Codigo Postal</label>
                    <div class="input-container">
                        <i class="fas fa-code input-icon"></i>
                        <input type="text" name="cp">
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirma la contraseña *</label>
                    <div class="input-container">
                        <input type="password" name="confirm_password" required>
                        <i class="fas fa-eye-slash eye-icon"></i>
                    </div>
                </div>

                <!-- Zona de Icono (Ocupa las dos columnas) -->
                <div class="form-group full-row">
                    <label>Icono</label>
                    <div class="drop-zone">
                        <input type="file" name="icono" id="icono-file" hidden>
                        <label for="icono-file" class="drop-zone-content">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span>Arrastra el archivo</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn-submit-register">Registrarse</button>
            </form>
        </section>
    </main>

    <footer class="main-footer"></footer>

    <script src="../assets/js/register.js"></script>
</body>

</html>
