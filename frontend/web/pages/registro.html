<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosquea - Únete a la comunidad</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/MssMunroe/Bosquea/refs/heads/main/frontend/web/assets/img/logo.png">    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/MssMunroe/Bosquea/refs/heads/main/frontend/web/assets/img/logo.png">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="register-bg">

    <header class="main-header"></header>

    <main class="content-wrapper">
        <section class="register-card">
            <h1 class="register-title">Crear Cuenta</h1>
            <form id="registerForm" class="grid-form">
                <div class="form-group">
                    <label>Nombre Completo *</label>
                    <div class="input-container">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" name="nombre" id="nombre" required placeholder="Tu nombre">
                    </div>
                </div>

                <div class="form-group">
                    <label>Nickname *</label>
                    <div class="input-container">
                        <i class="fas fa-at input-icon"></i>
                        <input type="text" name="nickname" id="nickname" required placeholder="Ej: JuanExplora">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email *</label>
                    <div class="input-container">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" name="email" id="email" required placeholder="correo@ejemplo.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>Contraseña *</label>
                    <div class="input-container">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" name="password" id="password" required>
                        <i class="fas fa-eye-slash eye-icon"></i>
                    </div>
                </div>

                <div class="form-group full-row">
                    <label>Foto de Perfil</label>
                    <div class="drop-zone">
                        <input type="file" name="icono" id="icono-file" hidden accept="image/*">
                        <label for="icono-file" class="drop-zone-content">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span>Haz clic para subir o arrastra una imagen</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn-submit-register">Finalizar Registro</button>
            </form>
        </section>
    </main>

    <footer class="main-footer"></footer>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
