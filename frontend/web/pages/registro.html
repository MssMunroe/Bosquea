<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosquea - Únete a la comunidad</title>
    <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/MssMunroe/Bosquea/refs/heads/main/frontend/web/assets/img/logo.png">
    <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/MssMunroe/Bosquea/refs/heads/main/frontend/web/assets/img/logo.png">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="register-bg">

    <header class="main-header"></header>

    <main class="content-wrapper register-wrapper">
        <section class="register-card">
            <h1 class="register-title">Crear Cuenta</h1>
            <form id="registerForm" class="grid-form">

                <div class="form-group">
                    <div class="input-container">
                        <span class="input-icon-wrapper"><i class="fas fa-user"></i></span>
                        <input type="text" name="nombre" id="nombre" required placeholder="Nombre Completo *">
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-container">
                        <span class="input-icon-wrapper"><i class="fas fa-at"></i></span>
                        <input type="text" name="nickname" id="nickname" required
                            placeholder="Nickname * (Ej: JuanExplora)">
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-container">
                        <span class="input-icon-wrapper"><i class="fas fa-envelope"></i></span>
                        <input type="email" name="email" id="email" required placeholder="Correo electrónico *" autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-container">
                        <span class="input-icon-wrapper"><i class="fas fa-id-card"></i></span>
                        <input type="text" name="dni" id="dni" required placeholder="DNI / NIE *">
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-container">
                        <span class="input-icon-wrapper"><i class="fas fa-map-marker-alt"></i></span>
                        <input type="text" name="codigo_postal" id="cp" required placeholder="Código Postal *">
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-container">
                        <span class="input-icon-wrapper"><i class="fas fa-phone"></i></span>
                        <input type="text" name="telefono" id="tel" required placeholder="Teléfono *" autocomplete="tel">
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-container">
                        <span class="input-icon-wrapper"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" id="password" required placeholder="Contraseña *">
                        <i class="fas fa-eye-slash eye-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-container">
                        <span class="input-icon-wrapper"><i class="fas fa-shield-alt"></i></span>
                        <input type="password" name="confirm_password" id="confirm_password" required
                            placeholder="Confirmar contraseña *">
                    </div>
                </div>

                <div class="form-group full-row">
                    <div class="drop-zone">
                        <input type="file" name="icono" id="icono-file" hidden accept="image/*">
                        <label for="icono-file" class="drop-zone-content">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span>Haz clic para subir o arrastra una imagen de perfil</span>
                        </label>
                    </div>
                </div>

                <div class="form-group full-row button-row">
                    <button type="submit" class="btn-submit-register">Registrarse</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="main-footer"></footer>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/register.js"></script>

</body>

</html>
