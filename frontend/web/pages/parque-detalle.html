<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../assets/img/logo.png">
    <title>Bosquea - Parque Natural</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Header dinámico -->
    <header class="main-header"></header>
    
    <main class="content-wrapper detail-page">
        <section class="park-detail-container">
            <!-- Título con línea inferior -->
            <h1 id="park-name" class="detail-title">Cargando Parque...</h1>
            
            <!-- Imagen Principal -->
            <div class="detail-image-container">
                <img id="park-image" src="" alt="Imagen del parque">
            </div>

            <!-- Descripción -->
            <article class="detail-description">
                <p id="park-description"></p>
            </article>

            <!-- Datos Básicos -->
            <section class="detail-data">
                <h2>Datos básicos</h2>
                <ul class="data-list">
                    <li><strong>Superficie:</strong>
                        <ul>
                            <li>Superficie total: <span id="data-surface-total"></span></li>
                            <li>Área de influencia socioeconómica: <span id="data-surface-socio"></span></li>
                        </ul>
                    </li>
                    <li><strong>Provincias:</strong> <span id="data-provincias"></span></li>
                    <li><strong>Comunidades Autónomas:</strong> <span id="data-comunidades"></span></li>
                    <li><strong>Coordenadas localización</strong> (Latitud, Longitud):
                        <ul id="data-coords">
                            <!-- Las coordenadas se cargarán aquí -->
                        </ul>
                    </li>
                </ul>
            </section>
        </section>
    </main>
    <!-- Footer dinámico -->
    <footer class="main-footer"></footer>

    <script src="../assets/js/main.js"></script>
</body>
</html>
