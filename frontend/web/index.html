<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosquea - Explora la Naturaleza</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/MssMunroe/Bosquea/refs/heads/main/frontend/web/assets/img/logo.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="main-header"></header>
    <div class="hero-container"></div>

    <main class="content-wrapper">
        <section class="info-section">
            <div class="info-box info-intro">
                <h2>¿Qué es Bosquea?</h2>
                <p>Tu guía interactiva para explorar los Parques Naturales. Consulta rutas, mapas y comparte tu experiencia.</p>
                <p class="highlight">La naturaleza te espera.</p>
            </div>

            <div class="info-box info-cta">
                <h2>Forma parte de la red</h2>
                <p>Crea tu perfil para guardar tus parques favoritos y registrar tus visitas.</p>
                <button class="btn-main-action" onclick="window.location.href='./pages/registro.html'">Empezar ahora</button>
            </div>
        </section>

        <h2 class="section-title">Parques Destacados</h2>
        <section class="parques-grid" id="contenedor-parques">
            <p class="loading">Buscando parques...</p>
        </section>
    </main>

    <footer class="main-footer"></footer>

    <script src="./assets/js/main.js"></script>
    <script src="./assets/js/parques.js"></script>
</body>
</html>
